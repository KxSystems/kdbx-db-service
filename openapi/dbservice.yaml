  /api/v0/deletes:
    post:
      tags:
      - Deletes
      operationId: deleteStart
      summary: Delete rows from a table
      description: |
        Submits a batch delete job for a table, removing the rows that match an optional time window and a filter. The job is asynchronous: the `202` carries a pending job response, deletion continues after it, and the final outcome is read from `GET /api/v0/deletes/{jobId}`.

        Rows are removed from the on-disk partitions and from the in-memory tiers, so a window reaching into the interval currently being ingested is accepted. The delete is bounded by the position in the stream at which it executes: rows arriving after that point are kept, even where they fall inside the requested window. In-memory rows go as each database process applies the delete, shortly after the job is accepted, so a query issued immediately afterwards may still return them.

        Rows already moved to an object storage tier cannot be deleted. A `startTS` on or before the object storage watermark is rejected with a `400`; raise `startTS` so that the window begins after the data held in object storage.

        For a table that is not partitioned, `startTS` and `endTS` are ignored and `filter` alone selects the rows to delete.
      parameters:
      - name: assembly
        in: query
        required: false
        description: Assembly to delete rows from. Required when DB Service is configured with more than one assembly; optional when exactly one assembly is configured.
        schema:
          type: string
          minLength: 1
        example: marketdata-emea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
            examples:
              deleteWithFilter:
                summary: Delete matching rows within a time window
                value:
                  table: trade
                  startTS: '2026.04.03D00:00:00.000000000'
                  endTS: '2026.04.04D00:00:00.000000000'
                  filter:
                  - - '='
                    - sym
                    - AAPL
              deleteAllInWindow:
                summary: Delete all rows within a time window
                value:
                  table: trade
                  startTS: '2026.04.03D00:00:00.000000000'
                  endTS: '2026.04.04D00:00:00.000000000'
                  filter: []
      responses:
        '202':
          description: Delete job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchImportStatusResponse'
              example: &idDeletePending
                jobId: 54f5cf87-dbc2-4336-d109-173ed56c0b86
                database: db
                jobType: delete
                status: pending
                affectedTables: []
                processedPartitions: []
                progress:
                  currentPartition: ''
                  partitionIndex: 0
                  partitionTotal: 0
                  currentTable: ''
                  tableIndex: 0
                  tableTotal: 0
                error: ''
                warnings: []
                updated: '2026-08-18T13:25:44.177025580'
        '400':
          description: Client error.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BatchImportStatusResponse'
                - $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                deleteErrored:
                  summary: Delete job errored
                  value: &idDeleteErrored
                    jobId: 7800725b-df34-f6cf-d17f-7bdfd525c24e
                    database: db
                    jobType: delete
                    status: errored
                    affectedTables: []
                    processedPartitions: []
                    progress:
                      currentPartition: ''
                      partitionIndex: null
                      partitionTotal: null
                      currentTable: ''
                      tableIndex: null
                      tableTotal: null
                    error: Cannot delete from object storage tier, please increase startTS to avoid overlap
                    warnings: []
                    updated: '2026-08-18T13:25:44.312559923'
                assemblyRequired:
                  summary: Assembly not specified
                  value:
                    error: assembly must be specified when the service is configured with more than one assembly
                assemblyUnknown:
                  summary: Unknown assembly
                  value:
                    error: 'unknown assembly: marketdata-emea'
        '503': *id503
      x-codeSamples:
      - lang: Python
        label: Python (matching rows)
        source: |
          session.delete_rows(
              table="trade",
              startTS="2026.04.03D00:00:00.000000000",
              endTS="2026.04.04D00:00:00.000000000",
              filter=[["=", "sym", "AAPL"]]
          )
      - lang: Python
        label: Python (all rows in window)
        source: |
          session.delete_rows(
              table="trade",
              startTS="2026.04.03D00:00:00.000000000",
              endTS="2026.04.04D00:00:00.000000000",
              filter=[]
          )
          # An empty filter is mandatory to delete every row in the window - a missing filter is rejected.
      - lang: Python
        label: Python (specific assembly)
        source: |
          session.delete_rows(
              table="trade",
              startTS="2026.04.03D00:00:00.000000000",
              endTS="2026.04.04D00:00:00.000000000",
              filter=[["=", "sym", "AAPL"]],
              assembly="marketdata-emea"
          )
      - lang: q
        label: q (matching rows)
        source: |
          session.deleteRows[`table`startTS`endTS`filter!("trade";2026.04.03D00:00:00.000000000;2026.04.04D00:00:00.000000000;enlist("=";"sym";"AAPL"))]
      - lang: q
        label: q (all rows in window)
        source: |
          session.deleteRows[`table`startTS`endTS`filter!("trade";2026.04.03D00:00:00.000000000;2026.04.04D00:00:00.000000000;())]
      - lang: q
        label: q (specific assembly)
        source: |
          session.deleteRows[([table:"trade";startTS:2026.04.03D00:00:00.000000000;endTS:2026.04.04D00:00:00.000000000;filter:enlist("=";"sym";"AAPL");assembly:"marketdata-emea"])]
