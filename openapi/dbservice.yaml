openapi: 3.0.3
info:
  title: KDB-X Database Service API
  version: 0.1.0
  description: OpenAPI spec for the KDB-X Database Service.
servers:
  - url: http://localhost:8080
security: []
tags:
- name: Tables
  description: Create, inspect, list, and delete table schemas.
- name: Imports
  description: Ingest data and manage import jobs.
- name: Deletes
  description: Delete rows from a table and manage delete jobs.
- name: Query
  description: Query table data using structured, SQL, or q requests.
- name: Configuration
  description: Export DB Service configuration artifacts.
paths:
  /api/v0/query/simple:
    post:
      tags:
      - Query
      operationId: simple
      summary: Structured query
      description: Structured query using explicit parameters (table, time range, filters, aggregations) rather than a free-form query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructuredRequest'
            example:
              table: quote
              startTS: 2024.11.02T00:00:00.000
              endTS: 2024.11.03T00:00:00.000
              inputTZ: UTC
              outputTZ: UTC
              outputTZCols:
              - - createTS
                - updateTS
              filter:
              - - or
                - - '='
                  - sym
                  - DNDF.CAN
                - - '>'
                  - price
                  - '300.50'
              groupBy:
              - sym
              agg:
              - - minPx
                - min
                - price
              fill: zero
              temporality: slice
              sortCols:
              - sym
              - desc
              limit:
              - 3
              scope:
                assembly: marketdata-emea
              labels:
                region: emea
                assetClass: fx
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: f98f13f8-621b-4721-b242-3afb94077441
                  logCorr: f98f13f8-621b-4721-b242-3afb94077441
                  rcvTS: '2026-01-22T07:36:33.459000000'
                  http: json
                  api: simple
                  agg: ':192.168.240.7:5060'
                  refVintage: -9223372036854776000
                  rc: 0
                  ac: 0
                  ai: ""
                  limitApplied: false
                payload:
                - time: 0D07:33:41.240573052
                  sym: X
                  realTime: '2026-01-24T07:33:41.240473052'
                  ask: 2.975187
                  asize: 14
                  bid: 45.16773
                  bsize: 36
                  sensorID: 0
                  randomID: 14
                - time: 0D07:33:41.240573118
                  sym: K
                  realTime: '2026-01-24T07:33:41.240473118'
                  ask: 36.78192
                  asize: 27
                  bid: 61.92058
                  bsize: 28
                  sensorID: 0
                  randomID: 0
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request (invalid query or parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: 457984f5-7e75-4544-95b8-59823844bf7b
                  logCorr: 457984f5-7e75-4544-95b8-59823844bf7b
                  version: 1
                  rcvTS: '2026-03-31T07:12:12.483000000'
                  http: json
                  api: .query.simple
                  agg: ''
                  refVintage: 0
                  rc: 56
                  ac: 27
                  ai: Table not found, table=quote
                payload: []
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              example:
                error: Service unavailable.
      x-codeSamples:
      - lang: Python
        label: Python
        source: |
          session.query_simple(
              table="fxquote",
              startTS="2026.03.02D00:00:00.000",
              endTS="2026.03.03D00:00:00.000",
              sortCols=["ts"],
              limit=5,
          )
      - lang: q
        label: q
        source: |
          session.querySimple[`table`startTS`endTS`sortCols`limit!(`fxquote;2026.03.02D;2026.03.03D;enlist "ts"; 5)]
      - lang: cURL
        label: cURL
        source: |
          curl -s -X POST "http://localhost:8080/api/v0/query/simple" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{
              "table": "fxquote",
              "startTS": "2026.03.02D00:00:00",
              "endTS": "2026.03.03D00:00:00",
              "scope": {
                "assembly": "marketdata-emea"
              },
              "limit": 2
            }' | jq
  /api/v0/query/preview:
    post:
      tags:
      - Query
      operationId: preview
      summary: Preview (lightweight table sample)
      description: |
        Lightweight data retrieval that fetches a small sample of a table using minimal time and resources, for reviewing data or testing software compatibility with a schema.

        Returns up to `limit` rows from the table and time range. It is guaranteed to search all available data for results: if fewer than `limit` rows are returned, they contain all the available data. Beyond this there are no guarantees as to which particular rows are returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
            example:
              table: quote
              startTS: 2024.11.02T00:00:00.000
              endTS: 2024.11.03T00:00:00.000
              limit: 500
              scope:
                assembly: marketdata-emea
              labels:
                region: emea
                assetClass: fx
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: f98f13f8-621b-4721-b242-3afb94077441
                  logCorr: f98f13f8-621b-4721-b242-3afb94077441
                  rcvTS: '2026-01-22T07:36:33.459000000'
                  http: json
                  api: preview
                  agg: ':192.168.240.7:5060'
                  refVintage: -9223372036854776000
                  rc: 0
                  ac: 0
                  ai: ""
                  limitApplied: true
                payload:
                - time: 0D07:33:41.240573052
                  sym: X
                  realTime: '2026-01-24T07:33:41.240473052'
                  ask: 2.975187
                  asize: 14
                  bid: 45.16773
                  bsize: 36
                  sensorID: 0
                  randomID: 14
                - time: 0D07:33:41.240573118
                  sym: K
                  realTime: '2026-01-24T07:33:41.240473118'
                  ask: 36.78192
                  asize: 27
                  bid: 61.92058
                  bsize: 28
                  sensorID: 0
                  randomID: 0
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request (invalid query or parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: 457984f5-7e75-4544-95b8-59823844bf7b
                  logCorr: 457984f5-7e75-4544-95b8-59823844bf7b
                  version: 1
                  rcvTS: '2026-03-31T07:12:12.483000000'
                  http: json
                  api: .query.preview
                  agg: ''
                  refVintage: 0
                  rc: 56
                  ac: 27
                  ai: Table not found, table=quote
                payload: []
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              example:
                error: Service unavailable.
      x-codeSamples:
      - lang: Python
        label: Python
        source: |
          session.query_preview(
              table="fxquote",
              startTS="2026.03.02D00:00:00.000",
              endTS="2026.03.03D00:00:00.000",
              limit=5,
          )
      - lang: q
        label: q
        source: |
          session.queryPreview[`table`startTS`endTS`limit!(`fxquote;2026.03.02D;2026.03.03D;5)]
      - lang: cURL
        label: cURL
        source: |
          curl -s -X POST "http://localhost:8080/api/v0/query/preview" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{
              "table": "fxquote",
              "startTS": "2026.03.02D00:00:00",
              "endTS": "2026.03.03D00:00:00",
              "scope": {
                "assembly": "marketdata-emea"
              },
              "limit": 5
            }' | jq
  /api/v0/query/sql:
    post:
      tags:
      - Query
      operationId: sql
      summary: SQL query
      description: Executes a SQL query string (SELECT-only) against the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlRequest'
            example:
              query: select sym, bid, ask from quote where bid > 100 by sym
              scope:
                assembly: marketdata-emea
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: f98f13f8-621b-4721-b242-3afb94077441
                  logCorr: f98f13f8-621b-4721-b242-3afb94077441
                  rcvTS: '2026-01-22T07:36:33.459000000'
                  http: json
                  api: sql
                  agg: ':192.168.240.7:5060'
                  refVintage: -9223372036854776000
                  rc: 0
                  ac: 0
                  ai: ""
                  limitApplied: false
                payload:
                - sym: X
                  bid: 45.16773
                  ask: 2.975187
                - sym: K
                  bid: 61.92058
                  ask: 36.78192
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request (invalid query or parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: 457984f5-7e75-4544-95b8-59823844bf7b
                  logCorr: 457984f5-7e75-4544-95b8-59823844bf7b
                  version: 1
                  rcvTS: '2026-03-31T07:12:12.483000000'
                  http: json
                  api: .query.sql
                  agg: ''
                  refVintage: 0
                  rc: 56
                  ac: 27
                  ai: Table not found, table=quote
                payload: []
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              example:
                error: Service unavailable.
      x-codeSamples:
      - lang: Python
        label: Python
        source: |
          session.query_sql(query="SELECT * FROM instruments WHERE category LIKE 'EM'")
      - lang: q
        label: q
        source: |
          session.querySQL[enlist[`query]!enlist "SELECT * FROM instruments WHERE category LIKE 'EM'"]
      - lang: cURL
        label: cURL
        source: |
          curl -s -X POST "http://localhost:8080/api/v0/query/sql" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT * FROM instruments WHERE category LIKE '\''EM'\''", "scope": {"assembly": "marketdata-emea"}}' | jq
  /api/v0/query/q:
    post:
      tags:
      - Query
      operationId: qsql
      summary: Q query
      description: Executes a q query string against the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QSqlRequest'
            example:
              query: select from quote where sym=`DNDF.CAN, price>300.5
              agg: '{select minPx:min price by sym from x}'
              scope:
                assembly: marketdata-emea
              labels:
                region: emea
                assetClass: fx
      responses:
        '200':
          description: Query executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: f98f13f8-621b-4721-b242-3afb94077441
                  logCorr: f98f13f8-621b-4721-b242-3afb94077441
                  rcvTS: '2026-01-22T07:36:33.459000000'
                  http: json
                  api: qsql
                  agg: ':192.168.240.7:5060'
                  refVintage: -9223372036854776000
                  rc: 0
                  ac: 0
                  ai: ""
                  limitApplied: false
                payload:
                - sym: X
                  bid: 45.16773
                - sym: K
                  bid: 61.92058
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request (invalid query or parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                header:
                  corr: 457984f5-7e75-4544-95b8-59823844bf7b
                  logCorr: 457984f5-7e75-4544-95b8-59823844bf7b
                  version: 1
                  rcvTS: '2026-03-31T07:12:12.483000000'
                  http: json
                  api: .query.q
                  agg: ''
                  refVintage: 0
                  rc: 56
                  ac: 27
                  ai: Table not found, table=quote
                payload: []
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              example:
                error: Service unavailable.
      x-codeSamples:
      - lang: Python
        label: Python
        source: |
          session.query_q(query="select o:first bid,h:max bid,l:min bid,c:last bid by trddate,sym from fxquote")
      - lang: q
        label: q
        source: |
          session.queryQ[enlist[`query]!enlist "select o:first bid,h:max bid,l:min bid,c:last bid by trddate,sym from fxquote"]
      - lang: cURL
        label: cURL
        source: |
          curl -s -X POST "http://localhost:8080/api/v0/query/q" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"query": "select o:first bid,h:max bid,l:min bid,c:last bid by trddate,sym from fxquote", "scope": {"assembly": "marketdata-emea"}}' | jq
  /api/v0/imports/{jobId}:
    get:
      tags:
      - Imports
      operationId: ingestStatus
      summary: Get import status
      description: Returns the current status of a batch ingest job.
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
        description: Batch ingest job identifier.
      - name: assembly
        in: query
        required: false
        description: Assembly containing the import job. Required when DB Service is configured with more than one assembly; optional when exactly one assembly is configured.
        schema:
          type: string
          minLength: 1
        example: marketdata-emea
      responses:
        '200':
          description: Success. Job status returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchImportStatusResponse'
              example: &idImportCompleted
                jobId: 26adfb1d-29bc-fab9-5e32-73f80ea51300
                database: db
                jobType: import
                status: completed
                affectedTables:
                - forex
                processedPartitions:
                - '2026-02-03'
                progress:
                  currentPartition: ''
                  partitionIndex: 1
                  partitionTotal: 1
                  currentTable: ''
                  tableIndex: 0
                  tableTotal: 0
                error: ''
                warnings: []
                updated: '2026-03-22T13:25:44.312559923'
        '400':
          description: Client error.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BatchImportStatusResponse'
                - $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                importErrored:
                  summary: Import job errored
                  value: &idImportErrored
                    jobId: 7800725b-df34-f6cf-d17f-7bdfd525c24e
                    database: db
                    jobType: import
                    status: errored
                    affectedTables: []
                    processedPartitions: []
                    progress:
                      currentPartition: ''
                      partitionIndex: null
                      partitionTotal: null
                      currentTable: ''
                      tableIndex: null
                      tableTotal: null
                    error: 'table does not exist in the schema, but createTable flag was not set to true: tables=,`quotes'
                    warnings: []
                    updated: '2026-03-31T07:39:08.699688365'
                assemblyRequired:
                  summary: Assembly not specified
                  value:
                    error: assembly must be specified when the service is configured with more than one assembly
                assemblyUnknown:
                  summary: Unknown assembly
                  value:
                    error: 'unknown assembly: marketdata-emea'
        '503': &id503
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                unavailable:
                  summary: Service unavailable
                  value:
                    error: Service unavailable.
                noDatabase:
                  summary: No assembly has registered with the service yet
                  value:
                    error: No database is available
      x-codeSamples:
      - lang: Python
        label: Python (single assembly)
        source: session.get_import(job_id="3fa85f64-5717-4562-b3fc-2c963f66afa6")
      - lang: Python
        label: Python (specific assembly)
        source: session.get_import(job_id="3fa85f64-5717-4562-b3fc-2c963f66afa6", assembly="marketdata-emea")
      - lang: q
        label: q (single assembly)
        source: |
          session.getImport["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
      - lang: q
        label: q (specific assembly)
        source: |
          session.getImport[`jobId`assembly!("3fa85f64-5717-4562-b3fc-2c963f66afa6";"marketdata-emea")]
      - lang: cURL
        label: cURL (single assembly)
        source: |
          curl -X GET "http://localhost:8080/api/v0/imports/NAME" \
            -H "Accept: application/json" | jq
          # Note: Replace `NAME` above, with the "name" value returned from the import job.
      - lang: cURL
        label: cURL (specific assembly)
        source: |
          curl -X GET "http://localhost:8080/api/v0/imports/NAME?assembly=marketdata-emea" \
            -H "Accept: application/json" | jq
          # Note: Replace `NAME` above, with the "name" value returned from the import job.
    delete:
      tags:
      - Imports
      operationId: ingestDelete
      summary: Cancel import
      description: Attempts to cancel a running batch ingest job.
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
        description: Batch ingest job identifier.
      - name: assembly
        in: query
        required: false
        description: Assembly containing the import job to cancel. Required when DB Service is configured with more than one assembly; optional when exactly one assembly is configured.
        schema:
          type: string
          minLength: 1
        example: marketdata-emea
      responses:
        '200':
          description: Success. Job canceled.
          content:
            application/json:
              schema:
                type: string
              example: Ingest aborted
        '404':
          description: Import job was not found or is no longer in a cancelable phase.
          content:
            application/json:
              schema:
                type: string
              example: batch update not found or processing already started and therefore no longer abortable
        '400':
          description: Client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                assemblyRequired:
                  summary: Assembly not specified
                  value:
                    error: assembly must be specified when the service is configured with more than one assembly
                assemblyUnknown:
                  summary: Unknown assembly
                  value:
                    error: 'unknown assembly: marketdata-emea'
        '503': *id503
      x-codeSamples:
      - lang: Python
        label: Python (single assembly)
        source: session.cancel_import(job_id="3fa85f64-5717-4562-b3fc-2c963f66afa6")
      - lang: Python
        label: Python (specific assembly)
        source: session.cancel_import(job_id="3fa85f64-5717-4562-b3fc-2c963f66afa6", assembly="marketdata-emea")
      - lang: q
        label: q (single assembly)
        source: |
          session.cancelImport["3fa85f64-5717-4562-b3fc-2c963f66afa6"]
      - lang: q
        label: q (specific assembly)
        source: |
          session.cancelImport[`jobId`assembly!("3fa85f64-5717-4562-b3fc-2c963f66afa6";"marketdata-emea")]
      - lang: cURL
        label: cURL (single assembly)
        source: |
          curl -X DELETE "http://localhost:8080/api/v0/imports/NAME" \
            -H "Accept: application/json" | jq
          # Note: Replace `NAME` above, with the "name" value returned from the import job.
      - lang: cURL
        label: cURL (specific assembly)
        source: |
          curl -X DELETE "http://localhost:8080/api/v0/imports/NAME?assembly=marketdata-emea" \
            -H "Accept: application/json" | jq
          # Note: Replace `NAME` above, with the "name" value returned from the import job.
  /api/v0/imports/files:
    post:
      tags:
      - Imports
      operationId: importFiles
      summary: Import files
      description: Submit a batch ingest job for a table using files on the server. 
          
          
          For CSV ingest, processing order is `types` (initial parse), then `postparse` (transform/derive), then `include` (final output column selection). 
          

          Returns a pending job response; ingestion continues after the response. Final success/failure is available via GET /api/v0/imports/{jobId}.
      parameters:
      - name: assembly
        in: query
        required: false
        description: Assembly to import the files into. Required when DB Service is configured with more than one assembly; optional when exactly one assembly is configured.
        schema:
          type: string
          minLength: 1
        example: marketdata-emea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileIngestRequest'
            examples:
              fileIngestMinimal:
                summary: Minimal request
                value:
                  table: quote
                  path: quote.csv
              fileIngest:
                summary: Standard file ingest
                value:
                  table: quote
                  path: quote.csv
                  mode: merge
                  format: csv
                  delimiter: ','
                  decimal: .
                  headerRowIndex: 0
              fileIngestCreateTable:
                summary: File ingest — create table
                value:
                  table: quote
                  path: quote.csv
                  format: csv
                  delimiter: ','
                  decimal: .
                  createTable: true
                  header:
                  - time
                  - sym
                  - realTime
                  - bid
                  - ask
                  - bidSize
                  - askSize
                  include:
                  - bid
                  - ask
                  types: '   FF  '
                  headerRowIndex: 0
      responses:
        '202':
          description: Ingest job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchImportStatusResponse'
              example: &idImportPending
                jobId: 26adfb1d-29bc-fab9-5e32-73f80ea51300
                database: db
                jobType: import
                status: pending
                affectedTables: []
                processedPartitions: []
                progress:
                  currentPartition: ''
                  partitionIndex: 0
                  partitionTotal: 0
                  currentTable: ''
                  tableIndex: 0
                  tableTotal: 0
                error: ''
                warnings: []
                updated: '2026-03-22T13:25:44.177025580'
        '400':
          description: Client error.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BatchImportStatusResponse'
                - $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                importErrored:
                  summary: Import job errored
                  value: *idImportErrored
                assemblyRequired:
                  summary: Assembly not specified
                  value:
                    error: assembly must be specified when the service is configured with more than one assembly
                assemblyUnknown:
                  summary: Unknown assembly
                  value:
                    error: 'unknown assembly: marketdata-emea'
        '503': *id503
      x-codeSamples:
      - lang: Python
        label: Python (single assembly)
        source: |
          session.import_files(
            table="fxquote",
            path="fxquote.parquet"
          )
      - lang: Python
        label: Python (specific assembly)
        source: |
          session.import_files(
            table="fxquote",
            path="fxquote.parquet",
            assembly="marketdata-emea"
          )
      - lang: Python
        label: Python (standard file ingest)
        source: |
          session.import_files(
            table="fxquote",
            path="fxquote.csv.gz",
            assembly="marketdata-emea",
            format="csv",
            delimiter=",",
            decimal=".",
            headerRowIndex= 0
