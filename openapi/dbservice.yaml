      operationId: deleteDelete
      summary: Cancel a batch delete job
      description: >-
        Clears a batch delete job's tracked status, so that the job no longer appears in
        `GET /api/v0/deletes/{jobId}`. This does not abort or roll back an in-flight delete:
        once submitted, a delete always runs to completion.
      parameters:
