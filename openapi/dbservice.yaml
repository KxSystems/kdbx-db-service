components:
  schemas:

    Assembly:
      type: object
      description: |
        Complete assembly YAML returned by this endpoint.

        An assembly is the configuration DB Service uses to run one slice of a database. It tells DB Service which tables exist, which streams carry data and control messages, where data is stored, and which Storage Manager and DAP services operate on that data.
      properties:
        name:
          type: string
          description: >-
            Required short name that identifies this assembly. 
            
            Queries can use the exact name in `scope.assembly` to target this assembly directly.
          example: db
        description:
          type: string
          description: >-
            Optional human-readable summary of the assembly's purpose or the data it contains.
          example: DB Service assembly configuration
        labels:
          type: object
          minProperties: 1
          description: >-
            User-defined key-value pairs that identify the subset of data held by this assembly, such as `region: US` or `sector: Finance`. 
            
            Use labels to divide a logical database into queryable shards and route queries to matching assemblies. 
            
            Each assembly must have a unique combination of label values, although individual values may be reused.
          additionalProperties:
            type: string
            description: >-
              The value assigned to a label for this assembly, such as `US`, `Finance`, or `fx`.
          example:
            db: db
        tables:
          type: object
          minProperties: 1
          description: >-
            Defines the tables available in this assembly and how each table is
            structured and stored. Each key is a table name; its value defines the
            table's columns, storage type, partitioning, sort order, and update keys.
            A table with the same name must use the same schema in every assembly,
            and the database must contain at least one `partitioned` table.
          additionalProperties:
            type: object
            description: >-
              Defines a single table. The property name is the table name used when
              publishing data and issuing queries.
            required:
              - type
              - columns
            properties:
              description:
                type: string
                description: >-
                  Optional human-readable summary of the table, including what one
                  row represents and the type of data it contains.

              type:
                type: string
                enum:
                  - partitioned
                  - splayed
                  - basic
                  - splayed_mem
                description: >-
                  Controls how the table is stored. Use `partitioned` for time-series
                  or event data that moves through the RDB, IDB, and HDB; it requires
                  a timestamp `prtnCol`. Use `splayed` for supplementary or reference
                  data stored as separate column files and memory mapped across tiers.
                  Use `basic` for supplementary or reference data stored in one file
                  and memory mapped across tiers. Use `splayed_mem` for splayed data
                  that should be fully loaded into memory across tiers.

              blockSize:
                type: integer
                description: >-
                  Number of received records to buffer before writing data to disk.
                  Use a smaller value to reduce memory use at the cost of more frequent
                  disk writes, or a larger value to reduce disk writes at the cost of
                  more memory. If omitted, Storage Manager keeps received records in
                  memory until the next end-of-interval (EOI).

              prtnCol:
                type: string
                description: >-
                  Name of the timestamp column used to partition the table's data by
                  date. Required when `type` is `partitioned`; the referenced column
                  must have type `timestamp`.

              sortColsMem:
                type: array
                items:
                  type: string
                description: >-
                  Columns used to sort data as it arrives in the in-memory RDB tier.
                  Sorting and the `sorted` column attribute are separate; set
                  `attrMem: sorted` on the relevant column when the sorted attribute
                  is also required.

              sortColsOrd:
                type: array
                items:
                  type: string
                description: >-
                  Columns used to sort data as it moves into an ordinal-partitioned
                  IDB tier. Set `attrOrd: sorted` on the relevant column when the
                  sorted attribute is also required.

              sortColsDisk:
                type: array
                items:
                  type: string
                description: >-
                  Columns used to sort data as it moves into date-partitioned disk
                  tiers such as the HDB. Set `attrDisk: sorted` on the relevant column
                  when the sorted attribute is also required.

              primaryKeys:
                type: array
                items:
                  type: string
                description: >-
                  Columns that uniquely identify a row. When primary keys are set, an
                  update with matching key values updates the existing row instead of
                  creating another row with the same key.

              isSharded:
                type: boolean
                description: >-
                  Set to `true` when different assemblies contain different portions
                  of this table. Omit it or use `false` when the table is not divided
                  across assemblies. The value must be consistent wherever the same
                  table is defined.

              oldName:
                type: string
                description: >-
                  Previous name of this table, used during a schema migration to
                  rename existing stored data instead of creating a new table. Remove
                  this value after the rename has completed.

              columns:
                type: array
                description: >-
                  Ordered list of columns in the table. The order of this list
                  determines the column order in stored and returned table data.
                items:
                  type: object
                  required:
                    - name
                    - type
                  properties:
                    name:
                      type: string
                      description: >-
                        Required name of the column. It must be unique within the
                        table. Avoid reserved q names, the names `date` and `int`,
                        and the reserved `label_` prefix.

                    description:
                      type: string
                      description: >-
                        Optional human-readable explanation of the values stored in
                        the column, including units or formatting where relevant.

                    type:
                      type: string
                      enum:
                        - ""
                        - boolean
                        - guid
                        - byte
                        - short
                        - int
                        - long
                        - real
                        - float
                        - char
                        - symbol
                        - timestamp
                        - month
                        - date
                        - datetime
                        - timespan
                        - minute
                        - second
                        - time
                        - booleans
                        - guids
                        - bytes
                        - shorts
                        - ints
                        - longs
                        - reals
                        - floats
                        - string
                        - symbols
                        - timestamps
                        - months
                        - dates
                        - datetimes
                        - timespans
                        - minutes
                        - seconds
                        - times
                      description: >-
                        Required q datatype for the column. Use singular names such
                        as `long`, `float`, or `timestamp` for scalar values, and
                        plural names such as `longs` or `timestamps` for vectors.
                        Use `string` for character vectors and `symbol` for repeated
                        text values. Prefer `timestamp` to the deprecated `datetime`
                        type. An empty string represents mixed data, for which every
                        value must itself be a list.

                    attrMem:
                      type: string
                      enum:
                        - sorted
                        - parted
                        - grouped
                        - unique
                      description: >-
                        Query-performance attribute applied in the in-memory RDB
                        tier. Use `sorted` for ascending data and binary-search
                        filtering; `parted` for contiguous groups of repeated values
                        and frequent filtering; `grouped` to index unsorted repeated
                        values at a higher memory cost; or `unique` when every value
                        is distinct. Omit it to use no index.

                    attrOrd:
                      type: string
                      enum:
                        - sorted
                        - parted
                        - grouped
                        - unique
                      description: >-
                        Query-performance attribute applied in an ordinal-partitioned
                        IDB tier. Use `sorted` for ascending data, `parted` for
                        contiguous groups, `grouped` to index unsorted repeated
                        values, or `unique` for distinct values. Both `sorted` and
                        `parted` require the data to be sorted.

                    attrDisk:
                      type: string
                      enum:
                        - sorted
                        - parted
                        - grouped
                        - unique
                      description: >-
                        Query-performance attribute applied in date-partitioned disk
                        tiers such as the HDB and subsequent storage tiers. Use
                        `parted` for a frequently filtered, sorted column; `sorted`
                        for ascending values; `grouped` for unsorted repeated values;
                        or `unique` for distinct values.

                    foreign:
                      type: string
                      description: >-
                        Defines this column as a foreign key to another column in the
                        same schema. Use the form `<table>.<column>`, for example
                        `markets.code`. Both columns must use the same datatype.

                    anymap:
                      type: boolean
                      description: >-
                        Set to `true` to store nested lists as a memory-mapped anymap
                        file. This defers loading until the column is accessed and can
                        reduce memory use.

                    oldName:
                      type: string
                      description: >-
                        Previous name of this column, used during a schema migration
                        to rename existing data instead of adding a new column. Remove
                        this value after the rename has completed.

                    backfill:
                      type: string
                      description: >-
                        Name of the q function used to populate this column for
                        existing rows when the column is added. Omit it to populate
                        existing rows with the null value for the column's datatype.
        bus:
          type: object
          description: >-
            Defines the named message streams used by database components to receive
            data and exchange control events. Use `rt` for the standard KX Reliable
            Transport service, `tp` to connect to a tick.q-compatible tickerplant, or
            `custom` for a user-provided implementation of the KX bus interface.
          additionalProperties:
            type: object
            description: >-
              Configures a single stream. The property name is the stream identifier
              referenced by other database components; common names are `internal`
              for communication within the assembly and `external` for communication
              with other systems.
            required:
              - protocol
            properties:
              protocol:
                type: string
                enum:
                  - rt
                  - tp
                  - custom
                description: >-
                  Selects the messaging transport. Use `rt` for KX Reliable Transport,
                  the standard option for Insights deployments; `tp` for a
                  tick.q-compatible tickerplant; or `custom` when a package provides
                  its own implementation of the KX bus publish and subscribe interface.

              topic:
                type: string
                description: >-
                  Identifies the topic used by this stream. For an `rt` stream, the
                  effective topic name is prefixed with the assembly name, for example
                  `<assembly-name>-<topic>`.

              nodes:
                type: array
                items:
                  type: string
                description: >-
                  Lists the host and port connection strings for the stream nodes.
                  For `rt`, the nodes and topic identify the Reliable Transport service.
                  For `tp`, only the first node in the list is used.
        mounts:
          type: object
          description: >-
            Defines the named storage locations and partition layouts used as data moves through the database's real-time, intraday, and historical tiers.
            Each key is a mount name referenced by a Storage Manager tier, for example by `elements.sm.tiers[].mount`.
          additionalProperties:
            type: object
            description: >-
              Configures one storage mount. The property name is its identifier; common names are `rdb`, `idb`, and `hdb`, although names are user-defined.
            required:
              - type
              - partition
              - baseURI
            properties:
              type:
                type: string
                enum:
                  - stream
                  - local
                description: >-
                  Selects where the data is held. Use `stream` for in-flight, real-time data such as an RDB tier; it does not use filesystem storage. 
                  Use `local` for data persisted to a filesystem, typically for IDB and HDB tiers.

              partition:
                type: string
                enum:
                  - none
                  - ordinal
                  - date
                description: >-
                  Controls how data is divided within the mount. 
                  Use `none` with a `stream` mount because no disk partitions are created. 
                  Use `ordinal` with a `local` mount for temporary, numbered partitions created at intervals defined by the tier schedule, typically for an IDB; 
                  these partitions reset when data rolls to the next tier. 
                  Use `date` with a `local` mount to organize historical data by the date from each table's timestamp `prtnCol`, typically for an HDB.

              baseURI:
                type: string
                description: >-
                  Root storage location for the mount. 
                  Set this to the literal `none` for a `stream` mount. 
                  For a `local` mount, specify a writable absolute file URI such as `file:///data/db/hdb`. 
                  Each local mount must use a unique path, and the Storage Manager owns and manages all content beneath it.
        elements:
          type: object
          description: >-
            Configures the services that run as part of this assembly. Use `sm` to
            receive, store, and move data through storage tiers; `dap` to make mounted
            data available for queries; `sp` for Stream Processor pipelines; and `rt`
            for the assembly's stream service.
          properties:
            sm:
              type: object
              description: >-
                Configures the Storage Manager, which receives data from a bus stream,
                writes it to storage, and moves it through the configured tiers from
                newest to oldest.
              required:
                - source
                - tiers
              properties:
                source:
                  type: string
                  description: >-
                    Required name of the `bus` entry from which the Storage Manager
                    receives data and database control events.

                initialImport:
                  type: boolean
                  description: >-
                    Set to `true` only when starting from an existing kdb+ database.
                    The Storage Manager requires a database under the `data`
                    subdirectory of the HDB mount's `baseURI` and terminates if none is
                    found. Remove this setting after the first successful startup.

                enforceSchema:
                  type: boolean
                  default: false
                  description: >-
                    Validates incoming data against the configured table schemas.
                    Invalid data is logged and discarded. Use this while developing or
                    validating schemas; it adds ingestion overhead. Schema enforcement
                    must also be enabled under `dap`.

                disableDiscovery:
                  type: boolean
                  description: >-
                    Disables service discovery. Use this only when running the
                    database as a standalone microservice without a discovery service.

                chunkSize:
                  type: integer
                  default: 500000
                  description: >-
                    Maximum number of records written to disk at once during an EOI or
                    EOD operation. Increase it for higher writedown throughput at the
                    cost of additional memory, or reduce it to limit memory use.

                sortLimitGB:
                  type: integer
                  default: 10
                  description: >-
                    Maximum number of gigabytes used for table data during a sort.
                    Data exceeding this limit is processed in chunks. Sort columns
                    must still fit fully in memory.

                waitTm:
                  type: integer
                  default: 250
                  description: >-
                    Number of milliseconds to wait between attempts to reconnect to
                    another database process.

                eodPeachLevel:
                  type: array
                  description: >-
                    Selects how EOD writes are parallelized. Use `part` to write
                    partitions in parallel, `table` to write tables in parallel, or
                    `column` to write columns within each table in parallel. Although
                    multiple values may be supplied, only the highest configured level
                    provides a performance benefit in KX 1.19. Column-level
                    parallelism is used by default.
                  items:
                    type: string
                    enum:
                      - part
                      - table
                      - column

                reloadTimeout:
                  type: string
                  description: >-
                    Maximum time the Storage Manager waits for DAPs and other clients
                    to reload their data purviews after a writedown. Specify a q
                    timespan such as `0D01:00:00`. It defaults to the EOI interval.

                idbUsed:
                  type: boolean
                  default: true
                  description: >-
                    Indicates whether a DAP serves an ordinal IDB mount. Set to `false`
                    when no IDB DAP exists; the Storage Manager then treats the RDB as
                    covering the period since the previous EOD.

                tiers:
                  type: array
                  minItems: 1
                  description: >-
                    Ordered storage tiers through which data moves, from the newest
                    data to the oldest. A typical configuration uses an in-memory RDB,
                    an ordinal IDB, and a date-partitioned HDB.
                  items:
                    type: object
                    required:
                      - name
                      - mount
                    properties:
                      name:
                        type: string
                        description: >-
                          Required unique name for the tier. It identifies the tier in
                          logs and operational messages.

                      mount:
                        type: string
                        description: >-
                          Required name of the `mounts` entry that determines where
                          and how this tier stores its data.

                      store:
                        type: string
                        description: >-
                          Physical URI used by this tier. Usually omit it to use
                          `none` for a stream mount or `<baseURI>/data` for a local
                          mount. Set it explicitly for object storage or when multiple
                          tiers use the same mount. For an ordinal local mount, an
                          explicit value is ignored.

                      schedule:
                        type: object
                        description: >-
                          Controls when data is rolled into this tier or moved to the
                          next tier.
                        properties:
                          freq:
                            type: string
                            description: >-
                              Length of each rollover interval, expressed as a q
                              duration such as `0D00:10:00`. For an ordinal IDB, this
                              determines how often a new ordinal partition is created.
                              The default IDB interval is ten minutes.

                          offset:
                            type: string
                            description: >-
                              Delays the interval schedule by the specified duration.
                              Use it to stagger EOI processing across Storage Managers
                              and reduce simultaneous resource usage. It must be less
                              than `freq` and defaults to `00:00:00`.

                          snap:
                            type: string
                            description: >-
                              Time of day at which data is moved into a date-partitioned
                              HDB tier. A value shortly after midnight provides a grace
                              period for data belonging to the previous date. Defaults
                              to `00:00:00`.

                      retain:
                        type: object
                        minProperties: 1
                        description: >-
                          Defines when data leaves this tier and rolls into the next
                          one. When both time and size limits are supplied, rollover
                          occurs when either limit is reached. Retention policies
                          cannot be used on ordinal-mounted tiers.
                        properties:
                          time:
                            type: string
                            description: >-
                              Maximum age of data in the tier, such as `2 Days`. Use
                              Years, Months, Weeks, or Days for a local date tier, and
                              Hours, Minutes, or Seconds for a stream tier.

                          sizePct:
                            type: integer
                            minimum: 1
                            maximum: 100
                            description: >-
                              Maximum percentage of the mount's storage that this tier
                              may use before data is rolled over. This option applies
                              only to local, date-partitioned tiers.

                      compression:
                        type: object
                        description: >-
                          Configures compression for data written to a local,
                          date-partitioned tier. Use `none` to avoid compression
                          overhead, or select another algorithm to reduce storage use.
                        required:
                          - algorithm
                        properties:
                          algorithm:
                            type: string
                            enum:
                              - none
                              - qipc
                              - gzip
                              - snappy
                              - lz4hc
                              - zstd
                            description: >-
                              Compression algorithm. Use `none` for no compression, `qipc`
                              for native q IPC compression, `snappy` when write and
                              read speed are preferred, or `gzip`, `lz4hc`, or `zstd`
                              when stronger or more configurable compression is
                              required.

                          block:
                            type: integer
                            minimum: 12
                            maximum: 20
                            description: >-
                              Compression block-size setting. Supply a value from 12
                              to 20 for every algorithm except `none`.

                          level:
                            type: integer
                            description: >-
                              Algorithm-specific compression level: `0` for `qipc` or
                              `snappy`, `0` to `9` for `gzip`, `1` to `12` for
                              `lz4hc`, or `-7` to `22` for `zstd`. Higher levels
                              generally trade additional CPU time for smaller data.

                      inventory:
                        type: object
                        description: >-
                          Creates an inventory file for an object-storage tier. Use
                          this to speed up later Storage Manager and DAP reloads. It
                          has no effect when `store` is not an object-storage URI.
                        properties:
                          enabled:
                            type: boolean
                            default: false
                            description: >-
                              Enables creation and use of the inventory file. A
                              `location` must also be supplied when this is `true`.

                          location:
                            type: string
                            description: >-
                              Path of the inventory file relative to the root of the
                              object-storage bucket, for example
                              `inventory/database-inventory.tgz`.

                      index:
                        type: integer
                        default: 0
                        description: >-
                          Controls the order of multiple HDB tiers. Lower values are
                          processed first; tiers with the same value retain their
                          order in the `tiers` list.

            dap:
              type: object
              description: >-
                Configures the Data Access Processes that expose mounted database
                tiers to the query system. Configure one DAP per mount for independent
                scaling, or one DAP with multiple mounts to scale all tiers together.
              required:
                - instances
              properties:
                enforceSchema:
                  type: boolean
                  default: false
                  description: >-
                    Enables schema enforcement for all DAP instances. Enable the same
                    setting under `sm` for end-to-end enforcement.

                lateData:
                  type: boolean
                  default: false
                  description: >-
                    Enables late and out-of-order data handling for all DAP instances.
                    DAPs then subscribe to the stream and retain records relevant to
                    their temporal purviews. The Storage Manager must also be started
                    with `KXI_LATE_DATA=true`.

                instances:
                  type: object
                  minProperties: 1
                  description: >-
                    Defines the DAP configurations in this assembly. Each key is a DAP
                    name, commonly `rdb`, `idb`, or `hdb` for independently scaled
                    tiers, or `db` for a single DAP serving all tiers.
                  additionalProperties:
                    type: object
                    description: >-
                      Configures one DAP. Supply exactly one of `mountName` or
                      `mountList`.
                    oneOf:
                      - required:
                          - mountName
                      - required:
                          - mountList
                    properties:
                      mountName:
                        type: string
                        description: >-
                          Name of the single mount served by this DAP. Use this mode
                          when each tier needs its own container, resources, or scaling
                          level.

                      mountList:
                        type: array
                        minItems: 1
                        uniqueItems: true
                        description: >-
                          Names of all mounts served by this DAP. Use this mode when
                          RDB, IDB, and HDB tiers should share resources and scale
                          together as a single DAP.
                        items:
                          type: string

                      pctMemThreshold:
                        type: number
                        format: double
                        minimum: 0
                        maximum: 1
                        description: >-
                          Fraction of the DAP's memory limit at which it flushes its
                          cache and enters low-memory mode. Use a lower value for more
                          memory headroom or a higher value to retain a larger cache.

                      enforceSchema:
                        type: boolean
                        default: false
                        description: >-
                          Enables schema enforcement for this DAP only. The Storage
                          Manager's `enforceSchema` setting must also be enabled.

                      lateData:
                        type: boolean
                        default: false
                        description: >-
                          Enables late and out-of-order data handling for this DAP.
                          Use the parent `dap.lateData` field instead when all DAPs
                          require the same setting. The Storage Manager must also use
                          `KXI_LATE_DATA=true`.

            sp:
              type: object
              description: >-
                Configures Stream Processor pipelines deployed as part of the
                assembly. Use this when the assembly itself ingests or transforms data;
                omit it when pipelines are deployed separately.
              additionalProperties: true

            rt:
              type: object
              description: >-
                Configures the stream service deployed as part of the assembly. Use
                this when the assembly owns its Reliable Transport deployment.
                Database connection details such as protocol, topic, and nodes remain
                under `bus`.
              additionalProperties: true
        dbSettings:
          type: object
          description: >-
            Applies settings to the database as a whole. In Insights 1.19, use this
            section to control encryption of all table data across every storage tier.
          properties:
            encryption:
              type: object
              description: >-
                Controls encryption of database data at rest. Enable it when stored
                database files must be encrypted. Encryption is independent of the
                compression configured for each storage tier.
              properties:
                encryptAll:
                  type: boolean
                  default: false
                  description: >-
                    Set to `true` to encrypt every table in every storage tier. Leave
                    as `false` for unencrypted storage. Changing this from `true` to
                    `false`, or removing it after encryption was enabled, decrypts the
                    database. When enabled, `KXI_ENCRYPTION_KEY_FILE` and
                    `KXI_ENCRYPTION_PASSWORD` must be configured for every Storage
                    Manager and DAP container.
        overrides:
          type: object
          description: >-
            Defines named variations of the base assembly configuration, allowing
            shared configuration to remain in one file. Each override contains only
            the settings to add or replace. Select overrides using
            `KXI_ASSEMBLY_OVERRIDES`; when several are selected, they are applied in
            order and later overrides take precedence over earlier ones.
          additionalProperties:
            type: object
            description: >-
              A named partial assembly configuration. Include only the sections and
              values that differ from the base configuration, such as changes to
              `tables`, `mounts`, `bus`, `elements`, or `dbSettings`.
            additionalProperties: true
      required:
      - name
      - tables
      - bus
      - mounts
      - elements
      additionalProperties: true

    TableSpec:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z][A-Za-z0-9_]*$
        description:
          type: string
        type:
          type: string
          enum:
          - partitioned
          - splayed
          - splayed_mem
          - basic
        blockSize:
          type: integer
          description: Block size for partitioned storage writes.
          default: 10000
          example: 10000
        prtnCol:
          type: string
          description: |
            Partition column to use for partitioned tables. The column chosen is your primary time filter: it is used by a query's `startTS`/`endTS` and determines the data layout on disk.

              - Required when table `type="partitioned"`.
              - `prtnCol` must reference a `timestamp` column.
              - Always considered UTC.

        sortColsMem:
          type: array
          items:
            type: string
          description: A list of columns to use for sorting columns in a memory tier. Setting this value will sort data as it arrives in memory.
          example: [sym]
        sortColsOrd:
          type: array
          items:
            type: string
          description: A list of columns to use for sorting columns in an ordinal partitioned tier. Setting this value will sort data as it migrates into ordinal partitions.
          example: [sym]
        sortColsDisk:
          type: array
          items:
            type: string
          description: A list of columns to use for sorting columns in a normal disk tier. Settings this value will sort data as it is migrated into disk partitions.
          example: [sym]
        primaryKeys:
          type: array
          items:
            type: string
          description: Names of columns to use as primary keys for this table. Primary keys identify unique rows. When provided, the table is keyed by these columns, and rows with matching keys update existing records.
          example: [sym, realTime]
        columns:
          type: array
          items:
            $ref: '#/components/schemas/TableColumnSpec'
      required:
      - name
      - columns
      additionalProperties: false

    CreateTableRequest:
      type: object
      properties:
        type:
          type: string
          description: |
            The table type.
          enum:
          - partitioned
          - splayed
          - splayed_mem
          - basic
        tableType:
          type: string
          description: |
            Alias for `type`, provided for convenience in the q client: `type` cannot be used as a key in compact dict syntax. If both `type` and `tableType` are given, `type` takes precedence; otherwise `tableType` is normalised to `type` server-side before the schema is applied.
          enum:
          - partitioned
          - splayed
          - splayed_mem
          - basic
        prtnCol:
          type: string
          description: |
            Partition column to use for partitioned tables. The column chosen is your primary time filter: it is used by a query's `startTS`/`endTS` and determines the data layout on disk.

              - Required when table `type="partitioned"`.
              - `prtnCol` must reference a `timestamp` column.
              - Always considered UTC.

        columns:
          type: array
          items:
            $ref: '#/components/schemas/TableColumnSpec'
        primaryKeys:
          type: array
          items:
            type: string
          description: Names of columns to use as primary keys for this table. Primary keys identify unique rows. When provided, the table is keyed by these columns, and rows with matching keys update existing records.
          example: [sym, realTime]
        blockSize:
          type: integer
          description: Block size for partitioned storage writes.
          default: 10000
          example: 10000
        sortColsMem:
          type: array
          items:
            type: string
          description: A list of columns to use for sorting columns in a memory tier. Setting this value will sort data as it arrives in memory.
          example: [sym]
        sortColsOrd:
          type: array
          items:
            type: string
          description: A list of columns to use for sorting columns in an ordinal partitioned tier. Setting this value will sort data as it migrates into ordinal partitions.
          example: [sym]
        sortColsDisk:
          type: array
          items:
            type: string
          description: A list of columns to use for sorting columns in a normal disk tier. Settings this value will sort data as it is migrated into disk partitions.
          example: [sym]
        description:
          type: string
      oneOf:
      - title: Partitioned table request
        properties:
          type:
            enum: [partitioned]
        required:
        - prtnCol
      - title: Non-partitioned table request
        properties:
          type:
            enum: [splayed, splayed_mem, basic]
      required:
      - type
      - columns
      additionalProperties: false

    TableColumnSpec:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: 'The name of the column in the table. Must be unique within the table and conform to kdb+ naming restrictions: avoid reserved primitives (`.Q.id`), reserved words `date`/`int`, and reserved prefix `label_`.'
          example: sym
        type:
          type: string
          description: |
            Any of the base [datatypes](https://code.kx.com/kdb-x/ref/datatypes.html) supported in KDB-X: `boolean`, `guid`, `byte`, `short`, `int`, `long`, `real`, `float`, `char`, `symbol`, `timestamp`, `month`, `date`, `datetime` (note, this is a deprecated q type), `timespan`, `minute`, `second`, or `time`.

            Vectors of the basic types are supported by supplying the plural of the base type name, except for `char` whose equivalent is `string`. For example: `ints` for a vector of `int`, `floats` for a vector of `float`, etc.

            Mixed types (KDB-X types of `0h`) are also supported by supplying an empty type, i.e. `"type": ""`. **NOTE** that due to the way KDB-X handles lists, inserting a non-list value as the first value of a table will corrupt the schema - ensure all values inserted into the column are lists.
          example: symbol
        colType:
          type: string
          description: |
            Alias for the column `type`, provided for convenience in the q client: `type` cannot be used as a key in compact dict syntax. If both `type` and `colType` are given, `type` takes precedence; otherwise `colType` is normalised to `type` server-side.
          example: symbol
        description:
          type: string
          description: Optional textual description of the column for documentation purposes.
          example: Instrument symbol
        attrMem:
          type: string
          description: Column attribute to apply in memory (typically RDB tier). See [attribute details](https://code.kx.com/insights/microservices/database/configuration/assembly/schema.html#attributes).
          example: grouped
        attrOrd:
          type: string
          description: Column attribute to apply in ordinal partitions (typically IDB tier). See [attribute details](https://code.kx.com/insights/microservices/database/configuration/assembly/schema.html#attributes).
          example: parted
        attrDisk:
          type: string
          description: Column attribute to apply on disk partitions (typically HDB tier). See [attribute details](https://code.kx.com/insights/microservices/database/configuration/assembly/schema.html#attributes).
          example: parted
        foreign:
          type: string
          description: >-
            Defines this column as a foreign key to another column in the same
            schema. Use the form `<table>.<column>`, for example
            `instruments.sym`. Both columns must use the same datatype, and the
            referenced column must be a primary key of the referenced table (see
            `primaryKeys`). Queries can then select, group by and filter on
            columns of the referenced table using the same `table.column`
            notation.
          example: instruments.sym
        # anymap:
        #   type: boolean
        #   description: Indicates if nested data can be stored as a memory-mapped anymap file. Compression is not currently supported for anymap columns.
        #   default: false
      required:
      - name
      - type

    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              code:
                type: string
                description: Stable, machine-readable error code.
              title:
                type: string
                description: Short, human-readable summary.
              detail:
                type: string
                description: Longer explanation for debugging.
              retryable:
                type: boolean
                description: Whether the client may retry safely.
            required:
            - code
            - title
            - retryable
            additionalProperties: false
        meta:
          type: object
          properties:
            corrId:
              type: string
            updatedAt:
              type: string
              format: date-time
              description: Time this response was last updated.
          required: [corrId, updatedAt]
          additionalProperties: false
      required:
      - errors
      - meta
      additionalProperties: false
