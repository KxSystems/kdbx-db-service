      properties:
        table:
          type: string
          description: Table name
          x-kx-type: -11h
        startTS:
          description: |
            Inclusive start of timestamp range. Optional; defaults to the full temporal range of the database. The timestamp must be midnight so the date range covers full days.
          type: string
          x-kx-type: -12h
        endTS:
          description: |
            Exclusive end of timestamp range. Optional; defaults to the full temporal range of the database. The timestamp must be midnight so the date range covers full days.
          type: string
          x-kx-type: -12h
        limit:
          description: Maximum number of rows to return. Defaults to 1000.
          type: integer
          x-kx-type: -7h
        scope:
          $ref: '#/components/schemas/ScopeObject'
        labels:
