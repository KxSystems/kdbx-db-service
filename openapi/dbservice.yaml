    BatchImportStatusResponse:
      type: object
      properties:
        jobId:
          type: string
          description: Unique identifier for the import job.
        database:
          type: string
          description: Target database where the import job is applied.
        jobType:
          type: string
          description: Type of job being performed.
          enum:
          - import
          - delete
        status:
          type: string
          description: Current state of the job, for example `pending`, `processing`, `completed`, `errored`, or `canceled`.
        affectedTables:
          type: array
          items:
            type: string
          description: Tables affected by the import job.
        processedPartitions:
          type: array
          items:
            type: string
            format: date
          description: Date partitions that the import job has reached so far.
        progress:
          type: object
          description: Progress information for import processing.
          properties:
            currentPartition:
              type: string
              description: Current partition being processed.
            partitionIndex:
              type: integer
              nullable: true
              description: Zero-based index of the current date partition.
            partitionTotal:
              type: integer
              nullable: true
              description: Total number of date partitions in the import job.
            currentTable:
              type: string
              description: Current table being processed within the current partition.
            tableIndex:
              type: integer
              nullable: true
              description: Zero-based index of the current table within the current partition.
            tableTotal:
              type: integer
              nullable: true
              description: Total number of tables in the current partition.
          required:
          - currentPartition
          - partitionIndex
          - partitionTotal
          - currentTable
