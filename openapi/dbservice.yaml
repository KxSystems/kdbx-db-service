    SqlRequest:
      type: object
      properties:
        query:
          type: string
          description: SQL expression. Must be a `SELECT`. No `INSERT`, `DROP`, or other extension is allowed.
        scope:
          $ref: '#/components/schemas/ScopeObject'
      required:
