  /api/v0/config/assembly:
    get:
      operationId: exportAssembly
      summary: Export assembly YAML
      description: |
        Exports the active assembly configuration for a DB Service deployment as YAML.

        The assembly is the database configuration document used by DB Service. It defines the assembly name, labels, table schemas, stream bus settings, storage mounts, and service elements such as Storage Manager tiers and DAP mounts.

        The response body is the YAML document itself, not a JSON wrapper.
      tags:
      - Configuration
      parameters:
      - name: assembly
        in: query
        required: false
        description: Name of the assembly configuration to export. Required when DB Service is configured with more than one assembly; optional when exactly one assembly is configured.
        schema:
          type: string
          minLength: 1
        example: marketdata-emea
      responses:
        '200':
          description: Active assembly returned as YAML.
          content:
            application/yaml:
              schema:
                $ref: '#/components/schemas/Assembly'
              example:
                name: Test assembly
                description: Test assembly
                labels:
                  region: NAM
                bus:
                  messages:
                    protocol: rt
                    topic: dataStream
                  stream:
                    protocol: custom
                    topic: dataStream
                    nodes:
                    - tick:5010
                mounts:
                  rdb:
                    type: stream
                    baseURI: none
                    partition: none
                  idb:
                    type: local
                    baseURI: file:///shared/data/db/idb
                    partition: ordinal
                  hdb:
                    type: local
                    baseURI: file:///shared/data/db/hdb
                    partition: date
                tables:
                  fxquote:
                    description: FX quote data
                    type: partitioned
                    blockSize: 10000
                    prtnCol: ts
                    sortColsMem:
                    - sym
                    sortColsOrd:
                    - sym
                    sortColsDisk:
                    - sym
                    columns:
                    - name: trddate
                      description: Trade date
                      type: date
                    - name: ts
                      description: Quote timestamp
                      type: timestamp
                    - name: sym
                      description: Symbol name
                      type: symbol
                      attrMem: grouped
                      attrOrd: parted
                      attrDisk: parted
                    - name: bid
                      description: Bid price
                      type: float
                    - name: ask
                      description: Ask price
                      type: float
                elements:
                  sm:
                    source: stream
                    tiers:
                    - name: stream
                      mount: rdb
                    - name: idb
                      mount: idb
                      schedule:
                        freq: 0D00:10:00
                    - name: hdb1
                      mount: hdb
                      schedule:
                        freq: 1D00:00:00
                        snap: "01:35:00"
                      retain:
                        time: 2 days
                      compression:
                        algorithm: gzip
                        block: 17
                        level: 9
                    enforceSchema: false
                    chunkSize: 500000
                    sortLimitGB: 1
                    waitTm: 250
                    eodPeachLevel:
                    - table
                    disableDiscovery: true
        '400': &idAssemblyError
          description: Client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              examples:
                assemblyRequired:
                  summary: Assembly not specified
                  value:
                    error: assembly must be specified when the service is configured with more than one assembly
                assemblyUnknown:
                  summary: Unknown assembly
                  value:
                    error: 'unknown assembly: marketdata-emea'
        '409':
          description: Assembly export is not available for this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleErrorResponse'
              example:
                error: Assembly export is only available for DB Service deployments.
        '503': *id503
      x-codeSamples:
