              schema:
                $ref: '#/components/schemas/BatchImportStatusResponse'
              example: &idDeleteCompleted
                jobId: 54f5cf87-dbc2-4336-d109-173ed56c0b86
                database: db
                jobType: delete
                status: completed
                affectedTables:
                - trade
