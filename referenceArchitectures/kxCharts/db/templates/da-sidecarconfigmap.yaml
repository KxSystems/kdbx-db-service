{{- if .Values.dbsSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "db.fullname" . }}-da-sidecar
  labels:
    {{- include "db.da.labels" . | nindent 4 }}
data:
{{ include "sidecar.configJson" (list . (dict "connPortList" .Values.sidecar.connPortList )) | indent 2 }}
{{- end }}
