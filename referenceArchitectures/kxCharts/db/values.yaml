  podAnnotations: {}

  # -- Allows adding node selector constraints to a Pod.
  # This constrains the pods to run only on nodes that match the specified labels.
  # Dictionary of key-value pairs.
  # Refer to NodeSelector https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- This is for setting Kubernetes Affinity to a Pod.
  # Refer to Pod Affinity https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
