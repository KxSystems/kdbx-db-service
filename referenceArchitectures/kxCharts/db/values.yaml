# Default values for db.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- This sets the name of the DB Service deployment.
# Overriding Chart name.
# Used when generating resource names.
nameOverride: ""

# -- This sets the full name of the DB Service deployment.
# Override the default fully qualified app name.
# By default resources are named using `<.Release.Name>-<.Chart.Name>`.
# Used when generating resource names.
fullnameOverride: ""

# -- Image pull secrets to be applied to all pods within the chart.
# For pulling an image from a private repository.
# More information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# @default -- `[]`
imagePullSecrets: []

# -- You must set your license name.
# Available types are:
#  - `"kc.lic"`
#  - `"k4.lic"`
#  - `"kx.lic"`
kxLicenseName: "kc.lic"

# -- Default image repository and pull settings for DB Service chart components.
# Refer to Images https://kubernetes.io/docs/concepts/containers/images/
# @default -- `{}`
image:
  # -- Image repository.
  # @default -- `"portal.dl.kx.com/"`
  repository: "portal.dl.kx.com"

  # -- Image pull policy.
  # Refer to Image Pull Policy https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
  pullPolicy: "IfNotPresent"

# -- Default Pod Security Context for DB Service chart components.
# Refer to Pod Security Context https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
# @default -- `{}`
podSecurityContext:
  fsGroup: 65534
  runAsUser: 65534
  runAsNonRoot: true

# -- Default security context for DB Service chart components.
# Refer to Security Context https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
# @default -- `{}`
securityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Defines whether the DB Service has `lateData` enabled.
# See the DB Service documentation for more information.
lateData: false

# -- Defines the RT stream name associated with the deployed DB Service instance.
# The prefix must match the deployed name of the RT stream, minus the replica number.
# Associated RT Stream pods 'rt-stream-<REPLICA-NO>'
stream:
  prefix: "rt-"
  name: "stream"
  replicas: 1

assembly:
  # -- This defines the assembly file to be loaded into the DB Service.
  # It should be on the base directory of the chart folder under `db`.
  # See the DB Service documentation for more information.
  filename: assembly.yaml

# DB Service storage configurations.
# This must be configured before deployment.
# @default -- `{}`
db:
  # Intraday persistent storage configuration.
  # @default -- `{}`
  idb:
    # -- Defines the storageClassNames for all the persistent data storage in the DB Service.
    # This should map to Kubernetes storageClassNames with accessMode of `RWM`.
    # More information can be found here: https://kubernetes.io/docs/concepts/storage/storage-classes/
    storageClassName: ""
    # storageClassName: "sharedfiles"

    # -- Size of the Intraday persistent storage.
    size: ""
    # size: "20Gi"

  # HDB Tier 1 persistent storage configuration.
  # @default -- `{}`
  hdbt1:
    # -- Defines the storageClassNames for all the persistent data storage in the DB Service.
    # This should map to Kubernetes storageClassNames with accessMode of `RWM`.
    # More information can be found here: https://kubernetes.io/docs/concepts/storage/storage-classes/
    storageClassName: ""
    # storageClassName: "sharedfiles"

    # -- Size of the HDB Tier 1 persistent storage.
    size: ""
    # size: "20Gi"

  # File import staging storage configuration.
  # @default -- `{}`
  imports:
    # -- Enables a per-release import staging PVC mounted into DB Service.
    enabled: false

    # -- Mount path used by the DB Service file import API.
    mountPath: /imports

    # -- Defines the storageClassName for DB Service import staging storage.
    # This should map to a Kubernetes storageClassName with accessMode of `RWM`.
    storageClassName: ""
    # storageClassName: "sharedfiles"

    # -- Size of the import staging storage.
    size: ""
    # size: "1Gi"

# Configuration for the DA.
# @default -- `{}`
dbsDa:
  # -- This sets overriding container image information.
  # Use if you wish to target specific versions of the DA.
  # More information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  # @default -- `{}`
  image:
    # -- Image tag.
    tag: ""

  # -- This sets the number of replicas for the DA.
  # More information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#replicas-and-scaling
  replicaCount: 1

  # -- Can provide any valid `q` runtime argument here.
  # Full details here: https://code.kx.com/q/basics/cmdline/
  # **NOTE** the `-p` argument will be overridden by the `KXI_PORT` env variable.
  # @default -- `[]`
  args: []
    #- '-s'
    #- '2'
    #- '-w'
    #- '1946'
    #- '-g'
    #- '0'

  # -- Entrypoint for custom code written under `customcode`.
  # Create your custom code and UDAs under here and it will be loaded into the DA under `/opt/kx/packages/{customCodeEntry}.q`.
  # See the DB Service documentation for more information.
  customCodeEntry: udas.q

  # -- This is for setting up a service and the port in use by the DA.
  # More information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  # @default -- `{}`
  service:
    # -- Set exposed Service Port.
    # Refer to Service Ports https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 5040

    # -- This sets the service annotations for the DAP.
    # Dictionary of key-value pairs.
    # Refer to Object Annotations https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
    # @default -- `{}`
    annotations: {}

  # -- This defines how much storage should be assigned for rt logs storage in the DA.
  rtLogs:
    size: "2Gi"

  # -- Sets the available free string queries available for the DA.
  # Each has security and performance implications.
  # See the DB Service documentation for more information.
  allowedSbxApis: .query.q,.query.sql

  # -- Defines whether DB Service is secured to prevent qsql-based string executions.
  # If enabled only API function queries will be allowed on the DB Service.
  secureEnabled: false

  # -- Defines the name and port of the RC to allow the data to be accessed via queries.
  # This must be set to the appropriate full FQDN RC service and port.
  rcAddr: ""
  # rcAddr: "gw-rc:5040"

  # -- Links the DA to the appropriate service class configuration in your assembly
  # under `elements.dap.instances`.
  # See the DB Service documentation for more information.
  serviceClassConfig: dap

  # -- Default common environment variables for the DA.
  # Additional ENVs can be added and these overridden in custom values files.
  # If overriding `envs`, ensure you include all the default values.
  envs:
    - name: KXI_LOG_FORMAT
      value: text
    - name: KXI_LOG_LEVELS
      value: default:debug
    # -- RT running in single node mode
    # See the DB Service documentation for more information.
    # - name: RT_REPLICAS
    #   value: 1


  # -- Allows additional `volumes` to be added to the DAP.
  # Refer to Volumes https://kubernetes.io/docs/concepts/storage/volumes/
  # @default -- `[]`
  volumes: []

  # -- Allows additional `volumeMounts` to be added to the DA
  # Refer to Volumes https://kubernetes.io/docs/concepts/storage/volumes/
  # @default -- `[]`
  volumeMounts: []

  # -- This is for setting Kubernetes Annotations to a Pod.
  # Dictionary of key-value pairs.
  # Refer to Object Annotations https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}

  # -- Allows adding node selector constraints to a Pod.
  # This constrains the pods to run only on nodes that match the specified labels.
  # Dictionary of key-value pairs.
  # Refer to NodeSelector https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- This is for setting Kubernetes Affinity to a Pod.
  # Refer to Pod Affinity https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- This is for setting Kubernetes Tolerations to a Pod.
  # This allows the pods to be scheduled on nodes with matching taints.
  # Refer to Taint and Tolerations https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  # @default -- `[]`
  tolerations: []

  # -- This is for setting Kubernetes Labels to a Pod.
  # Dictionary of key-value pairs.
  # Refer to Object Labels https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  # @default -- `{}`
  podLabels: {}

  # -- DA Kubernetes resources.
  # Refer to Container Resources https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: "100m"
    #   memory: "128Mi"
    # requests:
    #   cpu: "100m"
    #   memory: "128Mi"

  # -- Define how pods are created/deleted.
  # `OrderedReady`, sequential; `Parallel`, all at once.
  # Refer to Pod Management https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#pod-management-policies
  podManagementPolicy: "Parallel"

  # -- Define how pod updates are applied.
  # `RollingUpdate`, replace gradually; `OnDelete`, replace only on delete.
  # More information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
  updateStrategy: {}

# Configuration for the SM.
