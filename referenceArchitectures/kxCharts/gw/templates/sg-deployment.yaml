apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "gw.sg.labels" . | nindent 4 }}
    app: {{ include "gw.fullname" . }}-sg
  name: {{ include "gw.fullname" . }}-sg
spec:
  replicas: {{ .Values.dbsSg.replicaCount }}
  selector:
    matchLabels:
      {{- include "gw.sg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.dbsSg.podAnnotations }}
      annotations:
        {{- tpl ( toYaml . ) $ | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gw.sg.labels" . | nindent 8 }}
        {{- with .Values.dbsSg.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app: {{ include "gw.fullname" . }}-sg
    spec:
      serviceAccountName: {{ include "gw.fullname" . }}-sg
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sg
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}/kxi-sg-gw:{{ .Values.dbsSg.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: {{ .Values.dbsSg.service.ports.qipc }}
              protocol: TCP
            - containerPort: {{ .Values.dbsSg.service.ports.http }}
              protocol: TCP
            - containerPort: 8081
              protocol: TCP
          env:
            - name: GATEWAY_HTTP_PORT
              value: {{ .Values.dbsSg.service.ports.http | quote }}
            - name: GATEWAY_QIPC_PORT
              value: {{ .Values.dbsSg.service.ports.qipc | quote }}
            - name: KXI_SG_METRICS_ENABLED
              value: "true"
            - name: KXI_SG_METRICS_PORT
              value: "8081"
            - name: KXI_SG_RC_ADDR
              value: {{ include "gw.fullname" . }}-rc:{{ .Values.dbsRc.service.port }}
            {{- range .Values.dbsSg.smAddrs }}
            - name: KXI_SG_SM_ADDR_{{ .name }}
              value: {{ tpl .addr $ | quote }}
            {{- end }}
            - name: USE_SP_WATCHER
              value: "1"
            {{- if .Values.dbsSg.customIpcAuth.enabled }}
            - name: GATEWAY_EXT_QIPC_PORT
              value: {{ .Values.dbsSg.service.ports.qipcext | quote }}
            - name: KXI_SG_AUTH_IPC_HOST
              value: "localhost"
            - name: KXI_SG_AUTH_IPC_PORT
              value: {{ .Values.dbsSg.customIpcAuth.sidecar.port | quote }}
            - name: KXI_SG_AUTH_IPC_USE_TLS
              value: {{ .Values.dbsSg.customIpcAuth.sidecar.useTls | quote }}
            - name: KXI_SG_AUTH_IPC_AUTH_API
              value: {{ .Values.dbsSg.customIpcAuth.sidecar.authApi | quote }}
            {{- end }}
            {{- with .Values.dbsSg.envs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: "/tmp"
              readOnly: false
            - name: db-service-kx-license
              mountPath: /opt/kx/lic
              readOnly: true
            {{- with .Values.dbsSg.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.dbsSg.customIpcAuth.enabled }}
        - name: auth-provider
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.dbsSg.customIpcAuth.sidecar.image.repository }}/{{ .Values.dbsSg.customIpcAuth.sidecar.image.name }}:{{ .Values.dbsSg.customIpcAuth.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.dbsSg.customIpcAuth.sidecar.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.dbsSg.customIpcAuth.sidecar.port }}
              protocol: TCP
          env:
            {{- with .Values.dbsSg.customIpcAuth.sidecar.envs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: db-service-kx-license
              mountPath: /opt/kx/lic
              readOnly: true
            {{- with .Values.dbsSg.customIpcAuth.sidecar.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.dbsSg.customIpcAuth.sidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      restartPolicy: Always
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        {{- with .Values.dbsSg.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: db-service-kx-license
          secret:
            defaultMode: 420
            items:
              - key: license
                path: {{ .Values.kxLicenseName }}
            optional: false
            secretName: kx-license
        {{- if .Values.dbsSg.customIpcAuth.enabled }}
        {{- with .Values.dbsSg.customIpcAuth.sidecar.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with .Values.dbsSg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dbsSg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dbsSg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
