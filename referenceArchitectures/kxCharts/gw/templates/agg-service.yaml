apiVersion: v1
kind: Service
metadata:
  name: {{ include "gw.fullname" . }}-agg
  {{- with .Values.dbsAgg.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "gw.agg.labels" . | nindent 4 }}
    app: {{ include "gw.fullname" . }}-agg
spec:
  type: {{ .Values.dbsAgg.service.type }}
  ports:
    - port: {{ .Values.dbsAgg.service.port }}
      targetPort: {{ .Values.dbsAgg.service.port }}
      protocol: TCP
      name: agg-tcp
    {{- if .Values.dbsSidecar.enabled }}
    - port: 8080
      targetPort: metrics
      protocol: TCP
      name: agg-metrics
    {{- end }}
  selector:
    {{- include "gw.agg.selectorLabels" . | nindent 4 }}
