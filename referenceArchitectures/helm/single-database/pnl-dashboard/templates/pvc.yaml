---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pnl-dashboard.prefix" . }}-gw-data
  labels:
    {{- include "pnl-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: pnl-dashboard-gw
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
