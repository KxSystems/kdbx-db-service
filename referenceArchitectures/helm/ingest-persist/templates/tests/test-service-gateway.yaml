apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "db-service-ingest-persist.fullname" . }}-test-service-gateway"
  labels:
    {{- include "db-service-ingest-persist.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "db-service-ingest-persist.fullname" . }}-test
  restartPolicy: Never
  containers:
  - name: test-service-gateway
    image: curlimages/curl:latest
    command:
    - /bin/sh
    - -c
    - |
      set -e
      echo "Testing DB Service gateway HTTP endpoint..."
      SERVICE_NAME="{{ .Release.Name }}-gw-sg"
      HTTP_PORT=8080

      # Wait for service to be ready
      echo "Waiting for service ${SERVICE_NAME} to be ready..."
      echo "Endpoint: http://${SERVICE_NAME}:${HTTP_PORT}/"
      for i in $(seq 1 30); do
        status=$(curl -s -o /tmp/db-service-gateway-response.txt -w "%{http_code}" --max-time 5 http://${SERVICE_NAME}:${HTTP_PORT}/ || true)
        if [ "$status" != "000" ]; then
          echo "DB Service gateway HTTP listener is reachable. HTTP ${status}"
          break
        fi
        if [ $i -eq 30 ]; then
          echo "ERROR: DB Service gateway HTTP listener not reachable after 30 attempts. Last HTTP status: ${status}"
          cat /tmp/db-service-gateway-response.txt || true
          exit 1
        fi
        echo "Attempt $i/30: Service not ready, last HTTP status: ${status}; waiting..."
        sleep 2
      done

      echo "DB Service gateway test completed successfully"
