apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "db-service-api.fullname" . }}-test-pods-ready"
  labels:
    {{- include "db-service-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "db-service-api.fullname" . }}-test
  restartPolicy: Never
  containers:
  - name: test-pods-ready
    image: bitnami/kubectl:latest
    command:
    - /bin/bash
    - -c
    - |
      set -e
      echo "Checking if all DB Service gateway pods are ready..."

      RELEASE_NAME="{{ .Release.Name }}"
      NAMESPACE="{{ .Release.Namespace }}"

      # Check gw pods
      echo "Checking gw pods..."
      SG_PODS=$(kubectl get pods -n ${NAMESPACE} -l app=${RELEASE_NAME}-gw-sg --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l || echo "0")
      if [ "$SG_PODS" -lt "1" ]; then
        echo "ERROR: Service Gateway pods are not running"
        kubectl get pods -n ${NAMESPACE} -l app=${RELEASE_NAME}-gw-sg
        exit 1
      fi
      echo "SUCCESS: Service Gateway pods are running"

      echo "All DB Service gateway pods are ready!"
