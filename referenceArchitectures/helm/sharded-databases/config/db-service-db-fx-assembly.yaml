name: {{ .Values.assembly.name }}
description: DB Service sharded FX database
labels:
  assetClass: fx
  region: {{ .Values.labels.region }}

tables:
  fx_trade:
    type: partitioned
    isSharded: true
    prtnCol: time
    sortColsDisk: [pair]
    columns:
      - name: time
        type: timestamp
      - name: pair
        type: symbol
        attrDisk: parted
      - name: venue
        type: symbol
      - name: rate
        type: float
      - name: amount
        type: float
      - name: currency
        type: symbol
      - name: tradeID
        type: guid

bus:
  stream:
    protocol: rt
    topic: {{ .Values.stream.name }}

mounts:
  rdb:
    type: stream
    baseURI: none
    partition: none
  idb:
    type: local
    baseURI: file:///db/idb
    partition: ordinal
  hdb:
    type: local
    baseURI: file:///db/hdb
    partition: date

elements:
  dap:
    instances:
      dap:
        mountList:
          - rdb
          - idb
          - hdb

  sm:
    description: Storage manager
    source: stream
    tiers:
      - name: stream
        mount: rdb
      - name: idb
        mount: idb
        schedule:
          freq: 0D00:10:00 # every 10 minutes
      - name: hdb1
        mount: hdb
        store: file:///db/hdb
        schedule:
          freq: 1D00:00:00 # every day
          snap:   01:35:00 # at 1:35 AM
        retain:
          time: 2 days
    disableDiscovery: true
