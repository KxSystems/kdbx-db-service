upstream db_service_gateways {
    server ${DB_SERVICE_A_GATEWAY} max_fails=3 fail_timeout=5s;
    server ${DB_SERVICE_B_GATEWAY} max_fails=3 fail_timeout=5s;
}

server {
    listen 8080;
    default_type application/json;

    location = /api/v0/query/simple {
        proxy_pass http://db_service_gateways;
    }

    location = /api/v0/query/sql {
        proxy_pass http://db_service_gateways;
    }

    location = /api/v0/query/q {
        proxy_pass http://db_service_gateways;
    }

    location /api/v0/imports/ {
        return 400 '{"error":"This hot/hot load balancer only supports DB Service query endpoints: /api/v0/query/simple, /api/v0/query/sql, and /api/v0/query/q. Send import requests and import-status checks to both direct DB Service gateways."}';
    }

    location / {
        return 404 '{"error":"This hot/hot load balancer only supports DB Service query endpoints: /api/v0/query/simple, /api/v0/query/sql, and /api/v0/query/q."}';
    }
}
